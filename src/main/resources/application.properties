# Server
server.port=${SERVER_PORT:8081}

# Database - MariaDB
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:astro}?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SQL init
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Seller / GST
app.seller.state=Haryana
app.gst.rate=0.18

# JWT
jwt.secret=${JWT_SECRET:mySuperSecretKeyForJwtTokenGeneration123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# URL
frontend.url=${FRONTEND_URL:http://localhost:5100}
backend.url=${BACKEND_URL:http://localhost:8081}

# Uploads
app.uploads.dir=uploads
app.upload.avatar-subdir=avatars
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Nominatim (place autocomplete)
app.nominatim.url=https://nominatim.openstreetmap.org
app.nominatim.user-agent=SoftwareUniverse/1.0 (dev)

# Email (SMTP)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# App name
app.name=${APP_NAME:Software Universe}

# Logging
logging.level.com.astrologytalk=DEBUG

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Cashfree Payment Gateway
cashfree.app.id=${CASHFREE_APP_ID}
cashfree.secret.key=${CASHFREE_SECRET_KEY}
cashfree.mode=${CASHFREE_MODE:sandbox}
cashfree.webhook.secret=${CASHFREE_WEBHOOK_SECRET:}

# SabPaisa Payment Gateway
sabpaisa.merchant.id=${SABPAISA_MERCHANT_ID}
sabpaisa.api.key=${SABPAISA_API_KEY}
sabpaisa.secret.key=${SABPAISA_SECRET_KEY}
sabpaisa.base.url=${SABPAISA_BASE_URL:https://staging-sb-merchant-api.sabpaisa.in}
sabpaisa.environment=${SABPAISA_ENVIRONMENT:sandbox}
sabpaisa.verify.webhook=${SABPAISA_VERIFY_WEBHOOK:true}

# PayU Payment Gateway
payu.merchant.key=${PAYU_MERCHANT_KEY}
payu.merchant.salt=${PAYU_MERCHANT_SALT}
payu.base.url=${PAYU_BASE_URL:https://test.payu.in}
payu.client.id=${PAYU_CLIENT_ID:}
payu.client.secret=${PAYU_CLIENT_SECRET:}

# Razorpay Payment Gateway
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}
razorpay.base.url=https://api.razorpay.com/v1